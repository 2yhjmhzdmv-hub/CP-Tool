<style>
  :root{
    --bg: #f4f7f9;
    --surface: #ffffff;
    --line: #e1e7ec;
    --line-strong: #ccd5dc;
    --ink-900: #0a1828;
    --ink-700: #162a3e;
    --ink-500: #445463;
    --ink-400: #6a7c89;
    --ink-300: #9aaab6;
    --brand: #0A2845;
    --brand-700: #061b30;
    --brand-500: #1c3955;
    --petrol: #0096A0;
    --petrol-600: #007a83;
    --petrol-50: #e6f5f6;
  }
  *,*::before,*::after { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
    font-feature-settings: 'ss01', 'cv11';
    color: var(--ink-900);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  textarea { resize: vertical; }
  .font-mono { font-family: 'Geist Mono', ui-monospace, monospace; }
  .font-serif { font-family: 'Instrument Serif', ui-serif, Georgia, serif; }

  /* Subtle scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #c7d2da; border-radius: 999px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #9aaab6; }

  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* Inputs */
  .field {
    width: 100%;
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.5rem 0.75rem;
    font-size: 0.875rem;
    color: var(--ink-900);
    transition: border-color .15s, box-shadow .15s, background .15s;
    font-family: inherit;
  }
  .field:hover { border-color: var(--line-strong); }
  .field:focus {
    outline: none;
    border-color: var(--petrol);
    box-shadow: 0 0 0 3px rgba(0,150,160,0.15);
    background: #ffffff;
  }
  .field::placeholder { color: var(--ink-300); }
  select.field {
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke-width='2' stroke='%239aaab6'%3e%3cpath stroke-linecap='round' stroke-linejoin='round' d='m6 9 6 6 6-6'/%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 0.625rem center;
    background-size: 16px;
    padding-right: 2rem;
  }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-size: 0.8125rem; font-weight: 500;
    padding: 0 0.875rem; height: 36px;
    border-radius: 8px;
    transition: all .14s ease;
    white-space: nowrap;
    font-family: inherit;
    letter-spacing: -0.005em;
  }
  .btn-primary {
    background: var(--brand); color: #ffffff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 1px 2px rgba(10,40,69,0.18);
  }
  .btn-primary:hover { background: var(--brand-500); }
  .btn-primary:active { background: var(--brand-700); transform: translateY(0.5px); }
  .btn-accent {
    background: var(--petrol); color: #ffffff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 1px 2px rgba(0,150,160,0.20);
  }
  .btn-accent:hover { background: var(--petrol-600); }
  .btn-ghost {
    background: transparent; color: var(--ink-700);
    border: 1px solid transparent;
  }
  .btn-ghost:hover { background: #eef2f5; color: var(--ink-900); }
  .btn-outline {
    background: #ffffff; color: var(--ink-700);
    border: 1px solid var(--line);
  }
  .btn-outline:hover { background: #f1f5f8; border-color: var(--line-strong); }
  .btn-sm { height: 30px; padding: 0 0.625rem; font-size: 0.75rem; border-radius: 7px; }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
  }

  /* Search input wrapper */
  .search-wrap { position: relative; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--ink-300); pointer-events: none; }
  .search-wrap .field { padding-left: 32px; }

  /* Filter toolbar */
  .toolbar {
    display: flex; align-items: stretch;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(10,24,40,0.02), 0 6px 18px -8px rgba(10,24,40,0.06);
    transition: box-shadow .18s, border-color .18s;
  }
  .toolbar:focus-within { box-shadow: 0 1px 0 rgba(10,24,40,0.02), 0 8px 22px -8px rgba(10,24,40,0.10); }
  .toolbar-seg {
    position: relative;
    display: flex; align-items: center;
    min-height: 52px;
    padding: 0 16px;
    border-right: 1px solid var(--line);
    transition: background .15s;
  }
  .toolbar-seg:hover { background: #fbfcfd; }
  .toolbar-seg.is-active { background: #f5fbfb; }
  .toolbar-seg .seg-ico {
    width: 16px; height: 16px;
    flex-shrink: 0;
    color: var(--ink-300);
    margin-right: 10px;
    transition: color .15s;
  }
  .toolbar-seg.is-active .seg-ico { color: var(--petrol-600); }
  .toolbar-seg .seg-label {
    font-size: 0.6875rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-300);
    margin-right: 10px;
    user-select: none;
    transition: color .15s;
  }
  .toolbar-seg.is-active .seg-label { color: var(--petrol-600); }
  .toolbar-seg input,
  .toolbar-seg select {
    border: 0; background: transparent; outline: none;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--ink-900);
    font-family: inherit;
    padding: 0;
    appearance: none;
    background-image: none !important;
    box-shadow: none !important;
    cursor: pointer;
    letter-spacing: -0.005em;
  }
  .toolbar-seg input { cursor: text; font-weight: 400; }
  .toolbar-seg input::placeholder { color: var(--ink-300); font-weight: 400; }
  .toolbar-seg.seg-search { flex: 0 1 320px; min-width: 0; }
  .toolbar-seg.seg-search input { width: 100%; }
  .toolbar-seg.has-select { padding-right: 38px; cursor: pointer; }
  .toolbar-seg.has-select select { padding-right: 4px; }
  .toolbar-seg.has-select::after {
    content: '';
    position: absolute; right: 16px; top: 50%;
    width: 7px; height: 7px;
    border-right: 1.5px solid var(--ink-300);
    border-bottom: 1.5px solid var(--ink-300);
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
    transition: border-color .15s;
  }
  .toolbar-seg.has-select.is-active::after { border-color: var(--petrol-600); }
  .toolbar-reset {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 0 14px;
    border-right: 1px solid var(--line);
    color: var(--ink-500);
    font-size: 0.75rem; font-weight: 500;
    background: transparent;
    transition: background .14s, color .14s;
    cursor: pointer;
  }
  .toolbar-reset:hover { background: #f1f5f8; color: var(--ink-900); }
  .toolbar-count {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    padding: 0 18px;
    background: #fafcfd;
    font-size: 0.75rem;
    color: var(--ink-400);
    font-family: 'Geist Mono', ui-monospace, 'JetBrains Mono', monospace;
    letter-spacing: 0.01em;
  }
  .toolbar-count b { color: var(--ink-900); font-weight: 600; }
  .toolbar-count .count-dot {
    width: 5px; height: 5px; border-radius: 999px;
    background: var(--petrol);
    box-shadow: 0 0 0 3px rgba(0,150,160,0.18);
  }

  /* Tag (filter chips) */
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    height: 26px; padding: 0 10px;
    font-size: 0.75rem; font-weight: 500;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #ffffff;
    color: var(--ink-700);
    transition: all .14s;
  }
  .chip:hover { border-color: var(--line-strong); }
  .chip-dot { width: 6px; height: 6px; border-radius: 999px; }

  /* Sidebar link */
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; border-radius: 8px;
    font-size: 0.8125rem; font-weight: 500;
    color: var(--ink-500);
    cursor: pointer; transition: all .14s;
    letter-spacing: -0.005em;
  }
  .nav-item:hover { background: #e7edf2; color: var(--ink-900); }
  .nav-item.active { background: var(--brand); color: #ffffff; }
  .nav-item.active:hover { background: var(--brand-500); }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(10,24,40,0.42);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    padding: 1rem;
    animation: fadeIn .15s ease;
  }
  .modal-panel {
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 32px 64px -16px rgba(10,24,40,0.22), 0 8px 16px -4px rgba(10,24,40,0.10);
    width: 100%;
    max-height: 90vh;
    display: flex; flex-direction: column;
    overflow: hidden;
    animation: scaleIn .18s cubic-bezier(.2,.7,.4,1);
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scaleIn { from { opacity: 0; transform: translateY(4px) scale(.98); } to { opacity: 1; transform: none; } }

  /* Schutzbedarf badge variants — refined low-saturation, BMS-tuned */
  .sb-niedrig { background: #e6f1ee; color: #2e5a4d; }
  .sb-niedrig .sb-dot { background: #4a8a7a; }
  .sb-mittel  { background: #f7eed8; color: #6e4f10; }
  .sb-mittel  .sb-dot { background: #c08020; }
  .sb-hoch    { background: #f7e3df; color: #7a261f; }
  .sb-hoch    .sb-dot { background: #b53a31; }

  /* Table */
  .data-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.875rem; }
  .data-table thead th {
    text-align: left;
    padding: 10px 18px;
    font-size: 0.6875rem;
    font-weight: 500;
    color: var(--ink-400);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--line);
    background: #f7fafb;
  }
  .data-table tbody td {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }
  .data-table tbody tr:last-child td { border-bottom: none; }
  .data-table tbody tr { transition: background .12s; }
  .data-table tbody tr:hover { background: #f7fafb; }
  .data-table tbody tr.row-clickable { cursor: pointer; }

  /* ID pill */
  .id-pill {
    display: inline-flex; align-items: center;
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 0.6875rem;
    font-weight: 500;
    padding: 3px 8px;
    background: var(--petrol-50);
    color: var(--petrol-600);
    border: 1px solid #cfe6e8;
    border-radius: 6px;
    letter-spacing: -0.01em;
  }

  /* Tag (dienstleistung) */
  .tag {
    display: inline-flex; align-items: center;
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 0.6875rem;
    font-weight: 500;
    padding: 2px 7px;
    background: #ffffff;
    color: var(--ink-700);
    border: 1px solid var(--line);
    border-radius: 5px;
    letter-spacing: -0.005em;
  }

  /* Soft tag (schutzobjektart) */
  .tag-soft {
    display: inline-flex; align-items: center;
    font-size: 0.75rem;
    padding: 3px 9px;
    background: #eaf0f5;
    color: var(--ink-700);
    border-radius: 6px;
  }

  /* Critical-function pill */
  .pill-crit {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 0.6875rem;
    font-weight: 500;
    padding: 3px 9px;
    background: var(--petrol-50);
    color: var(--petrol-600);
    border: 1px solid #cfe6e8;
    border-radius: 999px;
  }

  /* Section label */
  .lbl {
    font-size: 0.6875rem;
    font-weight: 500;
    color: var(--ink-400);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
    display: block;
  }

  /* Selectable option (in form) */
  .opt {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    border: 1px solid var(--line);
    background: #ffffff;
    border-radius: 8px;
    cursor: pointer;
    transition: all .12s;
    font-size: 0.8125rem;
    color: var(--ink-700);
    user-select: none;
  }
  .opt:hover { border-color: var(--line-strong); background: #f7fafb; }
  .opt.is-checked {
    border-color: var(--brand);
    background: var(--brand);
    color: #ffffff;
  }
  .opt .opt-check {
    width: 14px; height: 14px;
    border: 1.5px solid var(--ink-300);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all .12s;
  }
  .opt.is-checked .opt-check { background: #ffffff; border-color: #ffffff; }
  .opt.is-checked .opt-check svg path { stroke: var(--brand) !important; }

  /* Radio segment (schutzbedarf in form) */
  .seg {
    display: inline-flex;
    padding: 3px;
    background: #eef2f5;
    border-radius: 10px;
    border: 1px solid var(--line);
    gap: 2px;
  }
  .seg-btn {
    padding: 6px 12px;
    font-size: 0.8125rem;
    font-weight: 500;
    border-radius: 7px;
    color: var(--ink-500);
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .14s;
  }
  .seg-btn:hover { color: var(--ink-900); }
  .seg-btn.is-active { background: #ffffff; color: var(--ink-900); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

  /* Responsive: scrollable toolbar on small screens */
  @media (max-width: 767px) {
    .toolbar-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .toolbar-scroll .toolbar { min-width: 520px; border-radius: 12px; }
  }

  /* Sidebar slide transition for mobile drawer */
  .sidebar-transition { transition: transform 0.22s cubic-bezier(.4,0,.2,1), width 0.2s; }

  @media print { .no-print { display: none !important; } }
</style>
</head>

  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pin));

};

const loadData = () => {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (!parsed.richtlinien) parsed.richtlinien = [];
      if (!parsed.assets)      parsed.assets     = [];
      if (!parsed.config)      parsed.config = DEFAULT_CONFIG;
      if (!parsed.users)       parsed.users  = [];
      return parsed;
    }
  } catch {}
  return null;
};
const saveData = data => localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

const gistHeaders = token => ({
  Authorization: `token ${token}`,
  'Content-Type': 'application/json',
  Accept: 'application/vnd.github.v3+json',
});

const loadFromGist = async (token, gistId) => {
  const res = await fetch(`https://api.github.com/gists/${gistId}`, { headers: gistHeaders(token) });
  if (!res.ok) throw new Error('Gist nicht erreichbar');
  const gist = await res.json();
  const content = gist.files[GIST_FILENAME]?.content;
  if (!content) throw new Error('Datei nicht im Gist gefunden');
  const parsed = JSON.parse(content);
  if (!parsed.richtlinien) parsed.richtlinien = [];
  if (!parsed.config)      parsed.config = DEFAULT_CONFIG;
  if (!parsed.users)       parsed.users  = [];
  return parsed;
};

const saveToGist = async (token, gistId, data) => {
  const res = await fetch(`https://api.github.com/gists/${gistId}`, {
    method: 'PATCH',
    headers: gistHeaders(token),
    body: JSON.stringify({ files: { [GIST_FILENAME]: { content: JSON.stringify(data, null, 2) } } }),
  });
  if (!res.ok) throw new Error('Speichern fehlgeschlagen');
};

const findOrCreateGist = async (token, seedData) => {
  const storedId = localStorage.getItem(GIST_ID_KEY);
  if (storedId) return storedId;
  const listRes = await fetch('https://api.github.com/gists?per_page=100', { headers: gistHeaders(token) });
  if (!listRes.ok) throw new Error('Gist-Liste nicht abrufbar');
  const gists = await listRes.json();
  const existing = gists.find(g => g.description === 'Compliance Tool Daten' && g.files[GIST_FILENAME]);
  if (existing) {
    localStorage.setItem(GIST_ID_KEY, existing.id);
    return existing.id;
  }
  const createRes = await fetch('https://api.github.com/gists', {
    method: 'POST',
    headers: gistHeaders(token),
    body: JSON.stringify({ description: 'Compliance Tool Daten', public: false, files: { [GIST_FILENAME]: { content: JSON.stringify(seedData, null, 2) } } }),
  });
  if (!createRes.ok) throw new Error('Gist konnte nicht erstellt werden');
  const created = await createRes.json();
  localStorage.setItem(GIST_ID_KEY, created.id);
  return created.id;
};

const ListEditor = ({ items, onAdd, onRemove, placeholder }) => {
  const [input, setInput] = useState('');
  const add = () => { const v = input.trim(); if (!v || items.includes(v)) return; onAdd(v); setInput(''); };
  return (
    <div className="space-y-2">
      <div className="flex flex-wrap gap-1.5">
        {items.map(item => (
          <span key={item} className="inline-flex items-center gap-1 px-2 py-1 bg-ink-50 border border-line rounded-md text-[12px] text-ink-700">
            {item}
            <button onClick={() => onRemove(item)} className="text-ink-300 hover:text-[#a13d36] ml-0.5"><Icon name="x" cls="w-3 h-3"/></button>
          </span>
        ))}
        {items.length === 0 && <span className="text-[12px] text-ink-300 italic">Noch keine Einträge</span>}
      </div>
      <div className="flex gap-2">
        <input className="field flex-1 text-[13px]" placeholder={placeholder || 'Neuer Eintrag…'} value={input}
          onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && add()}/>
        <button onClick={add} className="btn btn-outline btn-sm flex-shrink-0"><Icon name="plus" cls="w-3.5 h-3.5"/></button>
      </div>
    </div>
  );
};

  };
  const removeSub = (cat, val) => {
    onChange({ ...kategorien, [cat]: (kategorien[cat] || []).filter(s => s !== val) });
  };

  return (
    <div className="space-y-2">
      {cats.map(cat => (
        <div key={cat} className="border border-line rounded-lg overflow-hidden">
          <div className="flex items-center gap-2 px-3 py-2 bg-[#f7fafb] cursor-pointer" onClick={() => setExpanded(e => ({ ...e, [cat]: !e[cat] }))}>
            <Icon name="chev" cls={`w-3.5 h-3.5 text-ink-400 transition-transform ${expanded[cat] ? 'rotate-180' : ''}`}/>
            <span className="text-[13px] font-medium text-ink-900 flex-1 truncate">{cat}</span>
            <span className="text-[11px] text-ink-400 font-mono mr-2">{(kategorien[cat] || []).length} Unterkategorien</span>
            <button onClick={e => { e.stopPropagation(); removeCat(cat); }} className="p-1 text-ink-300 hover:text-[#a13d36]"><Icon name="trash" cls="w-3.5 h-3.5"/></button>
          </div>
          {expanded[cat] && (
            <div className="px-3 py-2.5 border-t border-line space-y-2">
              <div className="flex flex-wrap gap-1.5">
                {(kategorien[cat] || []).map(sub => (
                  <span key={sub} className="inline-flex items-center gap-1 px-2 py-1 bg-ink-50 border border-line rounded text-[11.5px] text-ink-700">
                    {sub}
                    <button onClick={() => removeSub(cat, sub)} className="text-ink-300 hover:text-[#a13d36]"><Icon name="x" cls="w-2.5 h-2.5"/></button>
                  </span>
                ))}
                {(kategorien[cat] || []).length === 0 && <span className="text-[11.5px] text-ink-300 italic">Keine Unterkategorien</span>}
              </div>
              <SubInput onAdd={val => addSub(cat, val)}/>
            </div>
          )}
        </div>
      ))}
      <div className="flex gap-2 pt-1">
        <input className="field flex-1 text-[13px]" placeholder="Neue Kategorie…" value={catInput}
          onChange={e => setCatInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && addCat()}/>
        <button onClick={addCat} className="btn btn-outline btn-sm flex-shrink-0"><Icon name="plus" cls="w-3.5 h-3.5"/> Kategorie</button>
      </div>
    </div>
  );
};

const SubInput = ({ onAdd }) => {
  const [v, setV] = useState('');
  const add = () => { if (!v.trim()) return; onAdd(v.trim()); setV(''); };
  return (
    <div className="flex gap-2">
      <input className="field flex-1 text-[12px]" placeholder="Neue Unterkategorie…" value={v}
        onChange={e => setV(e.target.value)} onKeyDown={e => e.key === 'Enter' && add()}/>
      <button onClick={add} className="btn btn-outline btn-sm flex-shrink-0"><Icon name="plus" cls="w-3 h-3"/></button>
    </div>
  );
};

// ── Einstellungen Modal ────────────────────────────────────────────────────
const EinstellungenModal = ({ data, onImport, onClose, syncStatus, onConnectGist, onDisconnectGist, onConfigChange, users, session, onCreateBenutzer, onUpdateBenutzer, onDeleteBenutzer }) => {
  const fileRef = useRef();
  const [tab, setTab] = useState('benutzer');
  const [benutzerModal, setBenutzerModal] = useState(null);
  const [tokenInput, setTokenInput] = useState('');
  const [connecting, setConnecting] = useState(false);
  const hasToken = !!localStorage.getItem(GIST_TOKEN_KEY);
  const gistId   = localStorage.getItem(GIST_ID_KEY);
  const cfg = getConfig(data);

  const updateConfig = (path, value) => {
    const parts = path.split('.');
    const newConfig = JSON.parse(JSON.stringify(data.config || DEFAULT_CONFIG));
    let node = newConfig;
    for (let i = 0; i < parts.length - 1; i++) { if (!node[parts[i]]) node[parts[i]] = {}; node = node[parts[i]]; }
    node[parts[parts.length - 1]] = value;
    onConfigChange(newConfig);
  };

  const doExport = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `compliance-backup-${today()}.json`; a.click();
    URL.revokeObjectURL(url);
  };

  const doImport = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (!parsed.anforderungen) return alert('Ungültiges Dateiformat.');
        if (confirm(`${parsed.anforderungen.length} Anforderungen importieren? Bestehende Daten werden überschrieben.`)) onImport(parsed);
      } catch { alert('Fehler beim Lesen der Datei.'); }
    };
    reader.readAsText(file);
  };

  const doConnect = async () => {
    if (!tokenInput.trim()) return alert('Bitte einen Token eingeben.');
    setConnecting(true);
    try { await onConnectGist(tokenInput.trim()); setTokenInput(''); }
    catch (e) { alert('Verbindung fehlgeschlagen: ' + e.message); }
    setConnecting(false);
  };

  const doClearLocal = () => {
    if (!confirm('Lokale Daten wirklich löschen?\n\nDas entfernt alle lokal gespeicherten Daten. Falls Gist-Sync aktiv ist, bleiben die Daten in der Cloud erhalten und werden beim nächsten Laden wiederhergestellt.')) return;
    localStorage.removeItem(STORAGE_KEY);
    window.location.reload();
  };

  const syncStatusLabel = {
    idle:    { text: 'Nicht verbunden', cls: 'text-ink-400' },
    syncing: { text: 'Synchronisiere…', cls: 'text-petrol-600' },
    synced:  { text: 'Synchronisiert',  cls: 'text-[#2e5a4d]' },
    error:   { text: 'Fehler',          cls: 'text-[#a13d36]' },
  }[syncStatus] || { text: '—', cls: 'text-ink-400' };

  const TABS = [
    { id: 'benutzer', label: 'Benutzer'      },
    { id: 'sync',     label: 'Sync & Backup' },
    { id: 'anf',      label: 'Anforderungen' },
    { id: 'rl',       label: 'Richtlinien'   },
  ];

  return (
    <Modal title="Einstellungen" onClose={onClose} size="xl">
      {/* Tab bar */}
      <div className="flex gap-1 border-b border-line -mx-6 px-6 mb-5">
        {TABS.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)}
            className={`px-4 py-2 text-[13px] font-medium border-b-2 transition-colors -mb-px ${tab === t.id ? 'border-petrol-500 text-petrol-600' : 'border-transparent text-ink-400 hover:text-ink-900'}`}>
            {t.label}
          </button>
        ))}
      </div>

      {tab === 'benutzer' && (
        <div className="space-y-4">
          <div className="flex items-center justify-between gap-4">
            <p className="text-[13px] text-ink-400">Benutzer und Zugriffsrechte verwalten.</p>
            <button onClick={() => setBenutzerModal('new')} className="btn btn-primary btn-sm flex-shrink-0">
              <Icon name="plus" cls="w-3.5 h-3.5"/> Neuer Benutzer
            </button>
          </div>
          <div className="card shadow-soft overflow-hidden">
            <table className="data-table">
              <thead><tr><th>Name</th><th>Rolle</th><th></th></tr></thead>
              <tbody>
                {(users || []).map(u => (
                  <tr key={u.id}>
                    <td>
                      <div className="flex items-center gap-2.5">
                        <div className="w-7 h-7 rounded-full bg-brand-100 flex items-center justify-center text-brand-700 text-[12px] font-semibold flex-shrink-0">
                          {u.name.charAt(0).toUpperCase()}
                        </div>
                        <p className="text-[13.5px] font-medium text-ink-900">{u.name}{u.id === session?.id && <span className="ml-2 text-[11px] text-ink-400">(ich)</span>}</p>
                      </div>
                    </td>
                    <td><span className={`text-[11.5px] font-medium px-2 py-0.5 rounded border ${ROLE_COLORS[u.role]}`}>{ROLE_LABELS[u.role]}</span></td>
                    <td onClick={e => e.stopPropagation()}>
                      <div className="flex items-center gap-0.5 justify-end">
                        <button onClick={() => setBenutzerModal(u)} className="p-1.5 rounded-md text-ink-400 hover:text-ink-900 hover:bg-ink-50 transition-colors" title="Bearbeiten"><Icon name="edit" cls="w-3.5 h-3.5"/></button>
                        {u.id !== session?.id && <button onClick={() => onDeleteBenutzer(u.id)} className="p-1.5 rounded-md text-ink-400 hover:text-[#a13d36] hover:bg-rose-50 transition-colors" title="Löschen"><Icon name="trash" cls="w-3.5 h-3.5"/></button>}
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {benutzerModal && (
            <BenutzerForm
              initial={benutzerModal === 'new' ? null : benutzerModal}
              onSave={f => { benutzerModal === 'new' ? onCreateBenutzer(f) : onUpdateBenutzer(f); setBenutzerModal(null); }}
              onClose={() => setBenutzerModal(null)}
              currentUserId={session?.id}
            />
          )}
        </div>
      )}

      {tab === 'sync' && (
        <div className="space-y-6">
          <div>
            <span className="lbl">GitHub Cloud-Sync</span>
            <div className="card divide-y divide-line">
              {hasToken ? (
                <div className="p-4 space-y-3">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-[#4a8a7a]"/>
                      <span className="text-[13px] font-medium text-ink-900">Verbunden</span>
                    </div>
                    <span className={`text-[12px] font-medium ${syncStatusLabel.cls}`}>{syncStatusLabel.text}</span>
                  </div>
                  {gistId && <p className="text-[11px] text-ink-400 font-mono">Gist: {gistId.slice(0,16)}…</p>}
                  <button onClick={onDisconnectGist} className="btn btn-outline btn-sm text-[#a13d36] border-[#f0b4b4] hover:bg-[#fbeded]">Verbindung trennen</button>
                </div>
              ) : (
                <div className="p-4 space-y-3">
                  <p className="text-[13px] text-ink-700">Personal Access Token mit Scope <span className="font-mono text-[11px] bg-ink-50 px-1 py-0.5 rounded border border-line">gist</span> eingeben.</p>
                  <div className="flex gap-2">
                    <input type="password" className="field flex-1" placeholder="ghp_… oder github_pat_…"
                      value={tokenInput} onChange={e => setTokenInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && doConnect()}/>
                    <button onClick={doConnect} disabled={connecting} className="btn btn-accent btn-sm flex-shrink-0">
                      {connecting ? 'Verbinde…' : 'Verbinden'}
                    </button>
                  </div>
                  <p className="text-[11px] text-ink-400">github.com → Settings → Developer settings → Personal access tokens</p>
                </div>
              )}
            </div>
          </div>
          <div>
            <span className="lbl">Datensicherung</span>
            <div className="card divide-y divide-line">
              <div className="flex items-center gap-4 p-4">
                <div className="flex-1">
                  <p className="text-[13px] font-medium text-ink-900">Exportieren</p>
                  <p className="text-xs text-ink-400 mt-0.5">Alle Daten als JSON-Backup speichern.</p>
                </div>
                <button onClick={doExport} className="btn btn-outline btn-sm"><Icon name="download" cls="w-3.5 h-3.5"/> Export</button>
              </div>
              <div className="flex items-center gap-4 p-4">
                <div className="flex-1">
                  <p className="text-[13px] font-medium text-ink-900">Importieren</p>
                  <p className="text-xs text-ink-400 mt-0.5">Backup wiederherstellen — überschreibt alle Daten.</p>
                </div>
                <button onClick={() => fileRef.current.click()} className="btn btn-outline btn-sm"><Icon name="upload" cls="w-3.5 h-3.5"/> Import</button>
                <input ref={fileRef} type="file" accept=".json" className="hidden" onChange={doImport}/>
              </div>
            </div>
          </div>
          <div>
            <span className="lbl">Speicher</span>
            <div className="card divide-y divide-line">
              <div className="p-4 space-y-2">
                {[['Anforderungen', (data.anforderungen||[]).length], ['Richtlinien', (data.richtlinien||[]).length]].map(([k,v]) => (
                  <div key={k} className="flex items-center justify-between text-[13px]">
                    <span className="text-ink-500">{k}</span>
                    <span className="font-mono font-medium text-ink-900">{v}</span>
                  </div>
                ))}
                <div className="flex items-center justify-between text-[13px]">
                  <span className="text-ink-500">Speicherort</span>
                  <span className={`font-mono text-xs ${hasToken ? 'text-[#2e5a4d]' : 'text-ink-700'}`}>
                    {hasToken ? 'GitHub Gist + localStorage' : 'localStorage (nur lokal)'}
                  </span>
                </div>
              </div>
              <div className="flex items-center gap-4 p-4">
                <div className="flex-1">
                  <p className="text-[13px] font-medium text-ink-900">Lokalen Speicher löschen</p>
                  <p className="text-xs text-ink-400 mt-0.5">Entfernt lokale Daten. Bei aktivem Gist-Sync werden Daten beim nächsten Start wiederhergestellt.</p>
                </div>
                <button onClick={doClearLocal} className="btn btn-outline btn-sm flex-shrink-0" style={{ color: '#a13d36', borderColor: '#f0c4c1' }}>
                  <Icon name="trash" cls="w-3.5 h-3.5"/> Löschen
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {tab === 'anf' && (
        <div className="space-y-5">
          <div>
            <span className="lbl">Kategorien & Unterkategorien</span>
            <p className="text-[12px] text-ink-400 mb-3">Kategorien und zugehörige Unterkategorien für Anforderungen verwalten.</p>
            <KategorienEditor
              kategorien={cfg.anfKategorien}
              onChange={val => updateConfig('anforderungen.kategorien', val)}
            />
          </div>
        </div>
      )}

      {tab === 'rl' && (
        <div className="space-y-6">
          <div>
            <span className="lbl">Kategorien</span>
            <p className="text-[12px] text-ink-400 mb-3">Kategorien für Richtlinien verwalten.</p>
            <ListEditor
              items={Object.keys(cfg.rlKategorien)}
              placeholder="z.B. Technisch, Organisatorisch…"
              onAdd={v => updateConfig('richtlinien.kategorien', { ...cfg.rlKategorien, [v]: [] })}
              onRemove={v => { const u = { ...cfg.rlKategorien }; delete u[v]; updateConfig('richtlinien.kategorien', u); }}
            />
          </div>
          <div>
            <span className="lbl">Art</span>
            <ListEditor items={cfg.rlArt} placeholder="z.B. Strategie, Richtlinie…"
              onAdd={v => updateConfig('richtlinien.art', [...cfg.rlArt, v])}
              onRemove={v => updateConfig('richtlinien.art', cfg.rlArt.filter(x => x !== v))}/>
          </div>
          <div>
            <span className="lbl">Anwender</span>
            <ListEditor items={cfg.rlAnwender} placeholder="z.B. Mitarbeitende…"
              onAdd={v => updateConfig('richtlinien.anwender', [...cfg.rlAnwender, v])}
              onRemove={v => updateConfig('richtlinien.anwender', cfg.rlAnwender.filter(x => x !== v))}/>
          </div>
          <div>
            <span className="lbl">Verantwortung</span>
            <ListEditor items={cfg.rlRollen} placeholder="z.B. CISO, IT-Leiter…"
              onAdd={v => updateConfig('richtlinien.rollen', [...cfg.rlRollen, v])}
              onRemove={v => updateConfig('richtlinien.rollen', cfg.rlRollen.filter(x => x !== v))}/>
          </div>
        </div>
      )}

    </Modal>
  );
};

    <span className={`inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md text-[11px] font-medium ${cfg.cls}`}>

// ── Form: Anforderung anlegen / bearbeiten ─────────────────────────────────
const AnforderungForm = ({ initial, onSave, onClose, anforderungen, config }) => {
  const isEdit = !!initial?.id;
  const kategorien = config?.anfKategorien || DEFAULT_KATEGORIEN;
  const defaultKat = Object.keys(kategorien)[0];
  const [form, setForm] = useState(() => initial || {
    anforderung_id: '', kategorie: defaultKat, unterkategorie: '', beschreibung: '',
  });

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const setKategorie = (kat) => setForm(f => ({ ...f, kategorie: kat, unterkategorie: '' }));

  const handleSave = () => {
    if (!form.anforderung_id.trim()) return alert('Bitte eine ID eingeben.');
    const idTrimmed = form.anforderung_id.trim();
    const duplicate = (anforderungen || []).some(a => a.id !== form.id && a.anforderung_id === idTrimmed);
    if (duplicate) return alert(`Die ID "${idTrimmed}" ist bereits vergeben.`);
    if (!form.beschreibung.trim()) return alert('Bitte eine Beschreibung eingeben.');
    onSave(form);
  };

  return (
    <Modal
      title={isEdit ? 'Anforderung bearbeiten' : 'Neue Anforderung'}
      subtitle={isEdit ? form.anforderung_id : 'Neue Anforderung erfassen'}
      onClose={onClose}
      size="lg"
      footer={
        <>
          <button onClick={onClose} className="btn btn-ghost">Abbrechen</button>
          <button onClick={handleSave} className="btn btn-primary">
            {isEdit ? 'Speichern' : 'Anforderung erstellen'}
          </button>
        </>
      }
    >
      <div className="space-y-5">
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <Field label="ID" required>
            <input className="field font-mono" value={form.anforderung_id} onChange={e => set('anforderung_id', e.target.value)} placeholder="A.5.1.1"/>
          </Field>
          <Field label="Kategorie">
            <select className="field" value={form.kategorie} onChange={e => setKategorie(e.target.value)}>
              {Object.keys(kategorien).map(k => <option key={k}>{k}</option>)}
            </select>
          </Field>
          <Field label="Unterkategorie">
            <select className="field" value={form.unterkategorie} onChange={e => set('unterkategorie', e.target.value)}>
              <option value="">— Bitte wählen —</option>
              {(kategorien[form.kategorie] || []).map(u => <option key={u}>{u}</option>)}
            </select>
          </Field>
        </div>
        <Field label="Beschreibung" required>
          <textarea className="field" rows={6} value={form.beschreibung} onChange={e => set('beschreibung', e.target.value)} placeholder="Anforderung präzise beschreiben…"/>
        </Field>
      </div>
    </Modal>
  );
};

// ── List view ──────────────────────────────────────────────────────────────
const AnforderungenView = ({ anforderungen, onCreate, onView, onEdit, onDelete, config, canEdit, canDelete }) => {
  const kategorien = config?.anfKategorien || DEFAULT_KATEGORIEN;
  const [search, setSearch] = useState('');
  const [kategorieFilter, setKategorieFilter] = useState('alle');

  const filtered = anforderungen.filter(a => {
    const q = search.toLowerCase();
    const matchSearch = !q || a.anforderung_id.toLowerCase().includes(q) || a.beschreibung.toLowerCase().includes(q) || (a.kategorie || '').toLowerCase().includes(q) || (a.unterkategorie || '').toLowerCase().includes(q);
    const matchKat = kategorieFilter === 'alle' || a.kategorie === kategorieFilter;
    return matchSearch && matchKat;
  }).sort((a, b) => a.anforderung_id.localeCompare(b.anforderung_id));

  const hasFilter = search || kategorieFilter !== 'alle';

  return (
    <div className="space-y-6">
      {/* Header */}
      <div className="flex flex-wrap items-end justify-between gap-4">
        <div>
          <h1 className="text-[28px] font-medium text-ink-900 tracking-tight leading-none">
            Anforderungen
          </h1>
          <p className="text-[13px] text-ink-400 mt-2">
            Compliance-Anforderungen erfassen und verwalten.
          </p>
        </div>
        {canEdit && <button onClick={onCreate} className="btn btn-primary">
          <Icon name="plus" cls="w-3.5 h-3.5"/> Neue Anforderung
        </button>}
      </div>

      {/* Stats strip */}
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <StatCard label="Anforderungen gesamt" value={anforderungen.length} accent="black" icon="layers"/>
        <StatCard label="Kategorien" value={new Set(anforderungen.map(a => a.kategorie)).size} accent="petrol" icon="list"/>
      </div>

      {/* Toolbar */}
      <div className="toolbar-scroll"><div className="toolbar">
        <label className={`toolbar-seg seg-search ${search ? 'is-active' : ''}`}>
          <Icon name="search" cls="seg-ico"/>
          <input
            placeholder="Suche nach ID, Beschreibung, Kategorie…"
            value={search} onChange={e => setSearch(e.target.value)}
          />
        </label>
        <label className={`toolbar-seg has-select ${kategorieFilter !== 'alle' ? 'is-active' : ''}`} style={{ flex: '1 1 0', minWidth: 0 }}>
          <Icon name="layers" cls="seg-ico"/>
          <span className="seg-label">Kategorie</span>
          <select value={kategorieFilter} onChange={e => setKategorieFilter(e.target.value)} style={{ flex: 1, minWidth: 0 }}>
            <option value="alle">Alle</option>
            {Object.keys(kategorien).map(k => <option key={k}>{k}</option>)}
          </select>
        </label>
        {hasFilter && (
          <button onClick={() => { setSearch(''); setKategorieFilter('alle'); }} className="toolbar-reset">
            <Icon name="x" cls="w-3.5 h-3.5"/> Zurücksetzen
          </button>
        )}
        <div className="toolbar-count">
          {hasFilter && <span className="count-dot"/>}
          <span><b>{filtered.length}</b> von {anforderungen.length}</span>
        </div>
      </div></div>

      {/* Table */}
      <div className="card overflow-x-auto shadow-soft">
        {filtered.length === 0
          ? <EmptyState hasFilter={hasFilter} onCreate={onCreate} canEdit={canEdit}/>
          : <table className="data-table" style={{ minWidth: '700px' }}>
              <thead>
                <tr>
                  <th style={{ width: '110px' }}>ID</th>
                  <th>Beschreibung</th>
                  <th style={{ width: '220px' }}>Kategorie</th>
                  <th style={{ width: '60px' }}></th>
                </tr>
              </thead>
              <tbody>
                {filtered.map(a => (
                  <tr key={a.id} className="row-clickable" onClick={() => onView(a)}>
                    <td><span className="id-pill">{a.anforderung_id}</span></td>
                    <td>
                      <p className="text-[13.5px] text-ink-900 line-clamp-2 leading-snug">{a.beschreibung}</p>
                    </td>
                    <td>
                      <p className="text-[12.5px] text-ink-700 leading-snug">{a.kategorie}</p>
                      {a.unterkategorie && <p className="text-[11px] text-ink-400 mt-0.5 leading-snug truncate" style={{ maxWidth: '200px' }}>{a.unterkategorie}</p>}
                    </td>
                    {(canEdit || canDelete) && <td onClick={e => e.stopPropagation()}>
                      <div className="flex items-center gap-0.5 justify-end">
                        {canEdit && <button onClick={() => onEdit(a)} className="p-1.5 rounded-md text-ink-400 hover:text-ink-900 hover:bg-ink-50 transition-colors" title="Bearbeiten">
                          <Icon name="edit" cls="w-3.5 h-3.5"/>
                        </button>}
                        {canDelete && <button onClick={() => onDelete(a.id)} className="p-1.5 rounded-md text-ink-400 hover:text-[#a13d36] hover:bg-rose-50 transition-colors" title="Löschen">
                          <Icon name="trash" cls="w-3.5 h-3.5"/>
                        </button>}
                      </div>
                    </td>}
                  </tr>
                ))}
              </tbody>
            </table>
        }
      </div>
    </div>
  );
};

// ── Stat card ──────────────────────────────────────────────────────────────
const StatCard = ({ label, value, accent, icon }) => {
  const accents = {
    black:  { fg: '#0a1828', bg: '#e8ecef', dot: '#0a1828' },
    green:  { fg: '#2e5a4d', bg: '#e6f1ee', dot: '#4a8a7a' },
    yellow: { fg: '#6e4f10', bg: '#f7eed8', dot: '#c08020' },
    red:    { fg: '#7a261f', bg: '#f7e3df', dot: '#b53a31' },
    ink:    { fg: '#0A2845', bg: '#eef2f5', dot: '#0A2845' },
    sage:   { fg: '#2e5a4d', bg: '#e6f1ee', dot: '#4a8a7a' },
    amber:  { fg: '#6e4f10', bg: '#f7eed8', dot: '#c08020' },
    rose:   { fg: '#7a261f', bg: '#f7e3df', dot: '#b53a31' },
    petrol: { fg: '#0a5b62', bg: '#dff1f3', dot: '#0096A0' },
  };
  const c = accents[accent] || accents.ink;
  return (
    <div className="card p-4 shadow-soft">
      <span className="block text-[11px] font-medium text-ink-400 uppercase tracking-wider leading-snug mb-3">{label}</span>
      <div className="flex items-end justify-between gap-3">
        <p
          className="text-[26px] font-medium tracking-tight leading-none font-mono"
          style={{ color: c.fg }}
        >
          {String(value).padStart(2, '0')}
        </p>
        <span
          className="w-9 h-9 rounded-lg flex items-center justify-center shrink-0"
          style={{ background: c.bg, color: c.dot }}
        >
          <Icon name={icon} cls="w-[18px] h-[18px]"/>
        </span>
      </div>
    </div>
  );
};

// ── Empty state ────────────────────────────────────────────────────────────
const EmptyState = ({ hasFilter, onCreate, canEdit }) => (
  <div className="px-12 py-20 text-center">
    <div className="w-12 h-12 mx-auto mb-4 rounded-xl bg-ink-50 flex items-center justify-center text-ink-300">
      <Icon name={hasFilter ? 'search' : 'list'} cls="w-5 h-5"/>
    </div>
    <p className="text-[15px] font-medium text-ink-900 mb-1">
      {hasFilter ? 'Keine Treffer' : 'Noch keine Anforderungen'}
    </p>
    <p className="text-[13px] text-ink-400 mb-5">
      {hasFilter ? 'Passe die Filter an oder setze sie zurück.' : 'Lege deine erste Sicherheits- oder Compliance-Anforderung an.'}
    </p>
    {!hasFilter && canEdit && (
      <button onClick={onCreate} className="btn btn-primary">
        <Icon name="plus" cls="w-3.5 h-3.5"/> Neue Anforderung
      </button>
    )}
  </div>
);

// ── Vertraulichkeit Badge ─────────────────────────────────────────────────
const VertraulichkeitBadge = ({ id }) => {
  const v = VERTRAULICHKEIT.find(x => x.id === id);
  if (!v) return null;
  return (
    <span style={{ background: v.bg, color: v.fg, border: `1px solid ${v.border}` }}
      className="inline-flex items-center px-2 py-0.5 rounded text-[11.5px] font-medium">
      {v.label}
    </span>
  );
};

// ── RichtlinieForm ────────────────────────────────────────────────────────
const RichtlinieForm = ({ initial, onSave, onClose, anforderungen, config }) => {
  const isEdit = !!initial?.id;
  const pdfRef = useRef();
  const rlKategorien = config?.rlKategorien || DEFAULT_CONFIG.richtlinien.kategorien;
  const rlArt        = config?.rlArt        || DEFAULT_CONFIG.richtlinien.art;
  const rlAnwender   = config?.rlAnwender   || DEFAULT_CONFIG.richtlinien.anwender;
  const rlRollen     = config?.rlRollen     || [];
  const defaultKat   = Object.keys(rlKategorien)[0] || '';

  const [form, setForm] = useState(() => initial || {
    richtlinie_id: '', titel: '',
    kategorie: defaultKat,
    art: rlArt[1] || rlArt[0] || '',
    vertraulichkeit: 'K2',
    anwender: [], rollen: [],
    pdf: null, anforderungen_ids: [],
  });
  const [pdfLoading, setPdfLoading] = useState(false);
  const [anfSearch, setAnfSearch] = useState('');
  const [anfKatFilter, setAnfKatFilter] = useState('alle');

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const setKategorie = (kat) => setForm(f => ({ ...f, kategorie: kat }));
  const toggleList = (key, val) => setForm(f => ({
    ...f, [key]: (f[key] || []).includes(val) ? (f[key] || []).filter(x => x !== val) : [...(f[key] || []), val],
  }));
  const toggleAnforderung = (id) => setForm(f => ({
    ...f,
    anforderungen_ids: f.anforderungen_ids.includes(id)
      ? f.anforderungen_ids.filter(x => x !== id)
      : [...f.anforderungen_ids, id],
  }));

  const handlePdf = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) { alert('Die Datei ist zu groß (max. 4 MB).'); return; }
    setPdfLoading(true);
    const reader = new FileReader();
    reader.onload = ev => { set('pdf', { name: file.name, size: file.size, data: ev.target.result }); setPdfLoading(false); };
    reader.readAsDataURL(file);
  };

  const handleSave = () => {
    if (!form.richtlinie_id.trim()) return alert('Bitte eine ID eingeben.');
    if (!form.titel.trim()) return alert('Bitte einen Titel eingeben.');
    onSave(form);
  };

  return (
    <Modal title={isEdit ? 'Richtlinie bearbeiten' : 'Neue Richtlinie'} onClose={onClose} size="xl">
      <div className="space-y-5">
        {/* ID + Titel */}
        <div className="grid grid-cols-1 sm:grid-cols-[160px_1fr] gap-4">
          <Field label="ID" required>
            <input className="field font-mono" value={form.richtlinie_id} onChange={e => set('richtlinie_id', e.target.value)} placeholder="IS-R-1D"/>
          </Field>
          <Field label="Titel" required>
            <input className="field" value={form.titel} onChange={e => set('titel', e.target.value)} placeholder="Bezeichnung der Richtlinie"/>
          </Field>
        </div>

        {/* Kategorie + Art */}
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <Field label="Kategorie">
            <select className="field" value={form.kategorie} onChange={e => setKategorie(e.target.value)}>
              {Object.keys(rlKategorien).map(k => <option key={k}>{k}</option>)}
            </select>
          </Field>
          <Field label="Art">
            <select className="field" value={form.art} onChange={e => set('art', e.target.value)}>
              {rlArt.map(a => <option key={a}>{a}</option>)}
            </select>
          </Field>
        </div>

        {/* Vertraulichkeit */}
        <Field label="Vertraulichkeit">
          <div className="flex gap-2 flex-wrap mt-0.5">
            {VERTRAULICHKEIT.map(v => (
              <label key={v.id} onClick={() => set('vertraulichkeit', v.id)}
                className="flex items-center gap-2 px-3 py-2 rounded-lg border cursor-pointer transition-colors select-none"
                style={form.vertraulichkeit === v.id ? { background: v.bg, borderColor: v.border, color: v.fg } : { background: '#fff', borderColor: 'var(--line)', color: 'var(--ink-500)' }}>
                <span className="w-3.5 h-3.5 rounded-full border-2 flex-shrink-0 flex items-center justify-center transition-colors"
                  style={form.vertraulichkeit === v.id ? { background: v.fg, borderColor: v.fg } : { borderColor: 'var(--line-strong)' }}>
                  {form.vertraulichkeit === v.id && <Icon name="check" cls="w-2 h-2 text-white"/>}
                </span>
                <span className="text-[12.5px] font-medium">{v.label}</span>
              </label>
            ))}
          </div>
        </Field>

        {/* Anwender + Verantwortung */}
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <Field label="Anwender" hint="Mehrfachauswahl">
            <div className="flex flex-wrap gap-2 mt-0.5">
              {rlAnwender.map(opt => {
                const checked = (form.anwender || []).includes(opt);
                return (
                  <label key={opt} onClick={() => toggleList('anwender', opt)}
                    className={`flex items-center gap-2 px-3 py-1.5 rounded-lg border cursor-pointer transition-colors select-none text-[12.5px] font-medium ${checked ? 'bg-brand-600 border-brand-600 text-white' : 'bg-white border-line text-ink-500 hover:border-line-strong'}`}>
                    {opt}
                  </label>
                );
              })}
            </div>
          </Field>
          {rlRollen.length > 0 && (
            <Field label="Verantwortung" hint="Mehrfachauswahl">
              <div className="flex flex-wrap gap-2 mt-0.5">
                {rlRollen.map(opt => {
                  const checked = (form.rollen || []).includes(opt);
                  return (
                    <label key={opt} onClick={() => toggleList('rollen', opt)}
                      className={`flex items-center gap-2 px-3 py-1.5 rounded-lg border cursor-pointer transition-colors select-none text-[12.5px] font-medium ${checked ? 'bg-brand-600 border-brand-600 text-white' : 'bg-white border-line text-ink-500 hover:border-line-strong'}`}>
                      {opt}
                    </label>
                  );
                })}
              </div>
            </Field>
          )}
        </div>

        {/* PDF-Anhang */}
        <Field label="PDF-Dokument">
          <div className="flex items-center gap-3">
            {form.pdf ? (
              <div className="flex items-center gap-2 flex-1 min-w-0 px-3 py-2 bg-ink-50 rounded-lg border border-line">
                <Icon name="file-text" cls="w-4 h-4 text-ink-400 flex-shrink-0"/>
                <span className="text-[13px] text-ink-700 truncate">{form.pdf.name}</span>
                <span className="text-[11px] text-ink-400 flex-shrink-0">({Math.round(form.pdf.size / 1024)} KB)</span>
                <button onClick={() => set('pdf', null)} className="ml-auto text-ink-300 hover:text-rose-600 transition-colors"><Icon name="x" cls="w-3.5 h-3.5"/></button>
              </div>
            ) : (
              <div className="flex-1 px-3 py-2 bg-ink-50 rounded-lg border border-dashed border-line text-[13px] text-ink-400">
                {pdfLoading ? 'Wird geladen…' : 'Kein Dokument angehängt'}
              </div>
            )}
            <button type="button" onClick={() => pdfRef.current.click()} className="btn btn-outline btn-sm flex-shrink-0">
              <Icon name="paperclip" cls="w-3.5 h-3.5"/> Datei wählen
            </button>
            <input ref={pdfRef} type="file" accept=".pdf" className="hidden" onChange={handlePdf}/>
          </div>
          <p className="text-[11px] text-ink-400 mt-1">Nur PDF-Dateien, max. 4 MB</p>
        </Field>

        {/* Verknüpfte Anforderungen */}
        <Field label="Verknüpfte Anforderungen"
          hint={form.anforderungen_ids.length > 0 ? `${form.anforderungen_ids.length} ausgewählt` : 'Mehrfachauswahl'}>
          {anforderungen.length === 0 ? (
            <p className="text-[12.5px] text-ink-400 py-2">Noch keine Anforderungen vorhanden.</p>
          ) : (() => {
            const anfKats = ['alle', ...Object.keys(
              anforderungen.reduce((acc, a) => { if (a.kategorie) acc[a.kategorie] = 1; return acc; }, {})
            )];
            const filteredAnf = anforderungen.filter(a => {
              const q = anfSearch.toLowerCase();
              const matchQ = !q || a.anforderung_id.toLowerCase().includes(q) || (a.beschreibung || '').toLowerCase().includes(q);
              const matchK = anfKatFilter === 'alle' || a.kategorie === anfKatFilter;
              return matchQ && matchK;
            }).sort((a, b) => a.anforderung_id.localeCompare(b.anforderung_id));
            return (
              <div className="border border-line rounded-lg overflow-hidden">
                <div className="flex items-center border-b border-line bg-[#f7fafb]">
                  <div className="search-wrap flex-1 min-w-0 border-r border-line">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2" stroke="currentColor">
                      <circle cx="11" cy="11" r="7"/><path strokeLinecap="round" d="m20 20-3.5-3.5"/>
                    </svg>
                    <input className="field rounded-none border-0 shadow-none focus:ring-0 bg-transparent text-[12.5px]"
                      placeholder="ID oder Beschreibung suchen…"
                      value={anfSearch} onChange={e => setAnfSearch(e.target.value)}/>
                  </div>
                  <select className="field rounded-none border-0 shadow-none focus:ring-0 bg-transparent text-[12.5px] w-[180px] flex-shrink-0"
                    value={anfKatFilter} onChange={e => setAnfKatFilter(e.target.value)}>
                    {anfKats.map(k => <option key={k} value={k}>{k === 'alle' ? 'Alle Kategorien' : k}</option>)}
                  </select>
                  {(anfSearch || anfKatFilter !== 'alle') && (
                    <button onClick={() => { setAnfSearch(''); setAnfKatFilter('alle'); }}
                      className="px-2 py-1 text-ink-300 hover:text-ink-700 transition-colors flex-shrink-0 border-l border-line">
                      <Icon name="x" cls="w-3.5 h-3.5"/>
                    </button>
                  )}
                </div>
                <div className="max-h-[220px] overflow-y-auto divide-y divide-line">
                  {filteredAnf.length === 0 ? (
                    <p className="px-4 py-6 text-center text-[12.5px] text-ink-400">Keine Treffer</p>
                  ) : filteredAnf.map(a => {
                    const checked = form.anforderungen_ids.includes(a.id);
                    return (
                      <label key={a.id} onClick={() => toggleAnforderung(a.id)}
                        className={`flex items-start gap-3 px-3 py-2.5 cursor-pointer transition-colors select-none ${checked ? 'bg-brand-50' : 'hover:bg-ink-50'}`}>
                        <span className={`mt-0.5 w-4 h-4 rounded border-2 flex-shrink-0 flex items-center justify-center transition-colors ${checked ? 'bg-brand-600 border-brand-600' : 'border-ink-200'}`}>
                          {checked && <Icon name="check" cls="w-2.5 h-2.5 text-white"/>}
                        </span>
                        <div className="min-w-0">
                          <span className="text-[11px] font-mono font-semibold text-brand-600 mr-2">{a.anforderung_id}</span>
                          <span className="text-[12.5px] text-ink-500 mr-2">{a.kategorie}{a.unterkategorie ? ' · ' + a.unterkategorie : ''}</span>
                          <span className="text-[12.5px] text-ink-700 line-clamp-1">{a.beschreibung}</span>
                        </div>
                      </label>
                    );
                  })}
                </div>
                {form.anforderungen_ids.length > 0 && (
                  <div className="border-t border-line bg-[#f7fafb] px-3 py-2 flex items-center justify-between">
                    <span className="text-[11.5px] text-ink-500">{form.anforderungen_ids.length} Anforderung{form.anforderungen_ids.length !== 1 ? 'en' : ''} verknüpft</span>
                    <button onClick={() => setForm(f => ({ ...f, anforderungen_ids: [] }))}
                      className="text-[11.5px] text-ink-400 hover:text-[#a13d36] transition-colors">Alle entfernen</button>
                  </div>
                )}
              </div>
            );
          })()}
        </Field>

        <div className="flex justify-end gap-2 pt-2 border-t border-line">
          <button onClick={onClose} className="btn btn-ghost">Abbrechen</button>
          <button onClick={handleSave} className="btn btn-primary">{isEdit ? 'Speichern' : 'Richtlinie erstellen'}</button>
        </div>
      </div>
    </Modal>
  );
};

// ── RichtlinieDetailPanel ──────────────────────────────────────────────────
const RichtlinieDetailPanel = ({ richtlinie, onEdit, onClose, anforderungen, canEdit }) => {
  const linkedAnf = anforderungen.filter(a => (richtlinie.anforderungen_ids || []).includes(a.id));

  const downloadPdf = () => {
    const a = document.createElement('a');
    a.href = richtlinie.pdf.data;
    a.download = richtlinie.pdf.name;
    a.click();
  };

  return (
    <Modal title={richtlinie.richtlinie_id} subtitle={richtlinie.titel} onClose={onClose} size="lg"
      footer={
        <>
          <button onClick={onClose} className="btn btn-ghost">Schließen</button>
          {canEdit && <button onClick={onEdit} className="btn btn-primary">
            <Icon name="edit" cls="w-3.5 h-3.5"/> Bearbeiten
          </button>}
        </>
      }>
      <div className="space-y-6">
        {/* Meta grid */}
        <div className="grid grid-cols-2 gap-x-8 gap-y-4">
          <div>
            <span className="lbl">Kategorie</span>
            <p className="text-[13.5px] text-ink-900 font-medium">{richtlinie.kategorie}</p>
          </div>
          <div>
            <span className="lbl">Art</span>
            <p className="text-[13.5px] text-ink-900 font-medium">{richtlinie.art}</p>
          </div>
          <div>
            <span className="lbl">Vertraulichkeit</span>
            <VertraulichkeitBadge id={richtlinie.vertraulichkeit}/>
          </div>
          <div>
            <span className="lbl">Verantwortung</span>
            <div className="flex flex-wrap gap-1.5 mt-0.5">
              {(richtlinie.rollen || []).length === 0
                ? <span className="text-[13px] text-ink-400">—</span>
                : (richtlinie.rollen || []).map(r => (
                  <span key={r} className="inline-flex items-center gap-1 px-2 py-0.5 bg-ink-50 border border-line rounded text-[12px] text-ink-700">
                    <Icon name="user" cls="w-3 h-3 text-ink-400"/>{r}
                  </span>
                ))}
            </div>
          </div>
          <div>
            <span className="lbl">Anwender</span>
            <div className="flex flex-wrap gap-1.5 mt-0.5">
              {(richtlinie.anwender || []).length === 0
                ? <span className="text-[13px] text-ink-400">—</span>
                : (richtlinie.anwender || []).map(a => (
                  <span key={a} className="inline-flex items-center gap-1 px-2 py-0.5 bg-ink-50 border border-line rounded text-[12px] text-ink-700">
                    <Icon name="users" cls="w-3 h-3 text-ink-400"/>{a}
                  </span>
                ))}
            </div>
          </div>
          <div>
            <span className="lbl">PDF-Dokument</span>
            {richtlinie.pdf ? (
              <button onClick={downloadPdf} className="inline-flex items-center gap-1.5 text-[13px] text-brand-600 hover:underline mt-0.5">
                <Icon name="file-text" cls="w-3.5 h-3.5"/>
                {richtlinie.pdf.name}
              </button>
            ) : (
              <span className="text-[13px] text-ink-400">Kein Anhang</span>
            )}
          </div>
        </div>

        {/* Verknüpfte Anforderungen */}
        <div>
          <span className="lbl">Verknüpfte Anforderungen</span>
          {linkedAnf.length === 0 ? (
            <p className="text-[13px] text-ink-400 mt-1">Keine Anforderungen verknüpft.</p>
          ) : (
            <div className="mt-2 border border-line rounded-lg divide-y divide-line overflow-hidden">
              {linkedAnf.map(a => (
                <div key={a.id} className="flex items-start gap-3 px-3 py-2.5">
                  <span className="font-mono text-[11px] font-semibold text-brand-600 mt-0.5 flex-shrink-0">{a.anforderung_id}</span>
                  <span className="text-[12.5px] text-ink-700 leading-snug">{a.beschreibung}</span>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Zeitstempel */}
        <div className="grid grid-cols-2 gap-6 pt-4 border-t border-line">
          <div>
            <span className="lbl">Erstellt</span>
            <p className="text-[13px] text-ink-700 font-mono">{fmtDateTime(richtlinie.erstellt_am)}</p>
          </div>
          <div>
            <span className="lbl">Zuletzt geändert</span>
            <p className="text-[13px] text-ink-700 font-mono">{fmtDateTime(richtlinie.aktualisiert_am)}</p>
          </div>
        </div>
      </div>
    </Modal>
  );
};

const RichtlinienView = ({ richtlinien, onCreate, onView, onEdit, onDelete, config, canEdit, canDelete }) => {
  const rlKategorien = config?.rlKategorien || DEFAULT_CONFIG.richtlinien.kategorien;
  const rlArt        = config?.rlArt        || DEFAULT_CONFIG.richtlinien.art;
  const [search, setSearch] = useState('');
  const [katFilter, setKatFilter] = useState('alle');
  const [artFilter, setArtFilter] = useState('alle');

  const filtered = richtlinien.filter(r => {
    const q = search.toLowerCase();
    const matchSearch = !q || r.richtlinie_id.toLowerCase().includes(q) || r.titel.toLowerCase().includes(q) || r.kategorie.toLowerCase().includes(q);
    const matchKat = katFilter === 'alle' || r.kategorie === katFilter;
    const matchArt = artFilter === 'alle' || r.art === artFilter;
    return matchSearch && matchKat && matchArt;
  }).sort((a, b) => a.richtlinie_id.localeCompare(b.richtlinie_id));

  const hasFilter = search || katFilter !== 'alle' || artFilter !== 'alle';
  const katKeys = Object.keys(rlKategorien);

  const stats = useMemo(() => ({
    gesamt: richtlinien.length,
    kategorien: katKeys.reduce((acc, k) => ({ ...acc, [k]: richtlinien.filter(r => r.kategorie === k).length }), {}),
  }), [richtlinien, katKeys.join(',')]);

  return (
    <div className="space-y-6">
      {/* Header */}
      <div className="flex flex-wrap items-end justify-between gap-4">
        <div>
          <h1 className="text-[28px] font-medium text-ink-900 tracking-tight leading-none">Richtlinien</h1>
          <p className="text-[13px] text-ink-400 mt-2">Strategien, Richtlinien, Leitlinien und Verfahrensanweisungen verwalten.</p>
        </div>
        {canEdit && <button onClick={onCreate} className="btn btn-primary">
          <Icon name="plus" cls="w-3.5 h-3.5"/> Neue Richtlinie
        </button>}
      </div>

      {/* Stats */}
      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3" style={{ gridTemplateColumns: undefined }}>
        <StatCard label="Gesamt" value={stats.gesamt} accent="black" icon="book"/>
        {katKeys.slice(0, 4).map((k, i) => (
          <StatCard key={k} label={k} value={stats.kategorien[k] || 0} accent={['petrol','yellow','red','ink'][i] || 'ink'} icon="layers"/>
        ))}
      </div>

      {/* Toolbar */}
      <div className="toolbar-scroll"><div className="toolbar">
        <label className={`toolbar-seg seg-search ${search ? 'is-active' : ''}`}>
          <Icon name="search" cls="seg-ico"/>
          <input placeholder="Suche nach ID, Titel, Kategorie…" value={search} onChange={e => setSearch(e.target.value)}/>
        </label>
        <label className={`toolbar-seg has-select ${katFilter !== 'alle' ? 'is-active' : ''}`} style={{ flex: '1 1 0', minWidth: 0 }}>
          <Icon name="layers" cls="seg-ico"/>
          <span className="seg-label">Kategorie</span>
          <select value={katFilter} onChange={e => setKatFilter(e.target.value)} style={{ flex: 1, minWidth: 0 }}>
            <option value="alle">Alle</option>
            {katKeys.map(k => <option key={k}>{k}</option>)}
          </select>
        </label>
        <label className={`toolbar-seg has-select ${artFilter !== 'alle' ? 'is-active' : ''}`} style={{ flex: '1 1 0', minWidth: 0 }}>
          <Icon name="book" cls="seg-ico"/>
          <span className="seg-label">Art</span>
          <select value={artFilter} onChange={e => setArtFilter(e.target.value)} style={{ flex: 1, minWidth: 0 }}>
            <option value="alle">Alle</option>
            {rlArt.map(a => <option key={a}>{a}</option>)}
          </select>
        </label>
        {hasFilter && (
          <button onClick={() => { setSearch(''); setKatFilter('alle'); setArtFilter('alle'); }} className="toolbar-reset">
            <Icon name="x" cls="w-3.5 h-3.5"/> Zurücksetzen
          </button>
        )}
        <div className="toolbar-count">
          {hasFilter && <span className="count-dot"/>}
          <span><b>{filtered.length}</b> von {richtlinien.length}</span>
        </div>
      </div></div>

      {/* Tabelle */}
      <div className="card overflow-x-auto shadow-soft">
        {filtered.length === 0 ? (
          <div className="px-12 py-20 text-center">
            <div className="w-12 h-12 mx-auto mb-4 rounded-xl bg-ink-50 flex items-center justify-center text-ink-300">
              <Icon name={hasFilter ? 'search' : 'book'} cls="w-5 h-5"/>
            </div>
            <p className="text-[15px] font-medium text-ink-900 mb-1">{hasFilter ? 'Keine Treffer' : 'Noch keine Richtlinien'}</p>
            <p className="text-[13px] text-ink-400 mb-5">{hasFilter ? 'Passe die Filter an oder setze sie zurück.' : 'Erstelle deine erste Richtlinie.'}</p>
            {!hasFilter && canEdit && <button onClick={onCreate} className="btn btn-primary"><Icon name="plus" cls="w-3.5 h-3.5"/> Neue Richtlinie</button>}
          </div>
        ) : (
          <table className="data-table" style={{ minWidth: '900px' }}>
            <thead>
              <tr>
                <th style={{ width: '110px' }}>ID</th>
                <th>Titel</th>
                <th style={{ width: '160px' }}>Kategorie</th>
                <th style={{ width: '150px' }}>Art</th>
                <th style={{ width: '170px' }}>Vertraulichkeit</th>
                <th style={{ width: '60px' }}></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(r => (
                <tr key={r.id} className="row-clickable" onClick={() => onView(r)}>
                  <td><span className="id-pill">{r.richtlinie_id}</span></td>
                  <td>
                    <p className="text-[13.5px] text-ink-900 font-medium leading-snug">{r.titel}</p>
                    <div className="flex items-center gap-2 mt-1">

                        <span className="inline-flex items-center gap-1 text-[11px] text-brand-500">
                          <Icon name="link" cls="w-3 h-3"/>{r.anforderungen_ids.length} Anforderung{r.anforderungen_ids.length !== 1 ? 'en' : ''}

                      )}

                  </td>
                  <td><p className="text-[12.5px] text-ink-700">{r.kategorie}</p></td>
                  <td><span className="tag">{r.art}</span></td>
                  <td><VertraulichkeitBadge id={r.vertraulichkeit}/></td>

                    <div className="flex items-center gap-0.5 justify-end">

const SetupScreen = ({ onCreate, onCloudLoad }) => {
  const [mode, setMode]   = useState('setup'); // 'setup' | 'cloud'
  const [name, setName]   = useState('');
  const [pin, setPin]     = useState('');
  const [pin2, setPin2]   = useState('');
  const [token, setToken] = useState('');
  const [loading, setLoading] = useState(false);
  const [err, setErr]     = useState('');

  const handleCreate = async () => {
    if (!name.trim()) return setErr('Bitte einen Namen eingeben.');
    if (pin.length < 4) return setErr('PIN muss mindestens 4 Zeichen haben.');
    if (pin !== pin2) return setErr('PINs stimmen nicht überein.');
    const hashed = await hashPin(pin);
    onCreate({ id: uuid(), name: name.trim(), role: 'admin', pin: hashed });
  };

  const handleCloudLoad = async () => {
    if (!token.trim()) return setErr('Bitte einen Gist-Token eingeben.');
    setErr(''); setLoading(true);
    try {
      const gistId = await findOrCreateGist(token.trim(), SEED);
      const loaded  = await loadFromGist(token.trim(), gistId);
      if (!loaded.users || loaded.users.length === 0) {
        setErr('Keine Benutzer im Gist gefunden. Bitte Ersteinrichtung durchführen.');
        setLoading(false); return;
      }
      onCloudLoad(token.trim(), loaded);
    } catch (e) { setErr('Verbindung fehlgeschlagen: ' + e.message); }
    setLoading(false);
  };

  return (
    <div className="min-h-screen bg-[#eef3f7] flex items-center justify-center p-6">
      <div className="card shadow-soft w-full max-w-sm p-8 space-y-6">
        <div className="flex flex-col items-center gap-3">
          <div className="w-12 h-12 rounded-2xl bg-brand-600 flex items-center justify-center">
            <Icon name="shield" cls="w-6 h-6 text-white"/>
          </div>
          <div className="text-center">
            <h1 className="text-[20px] font-semibold text-ink-900">
              {mode === 'setup' ? 'Ersteinrichtung' : 'Cloud-Verbindung'}
            </h1>
            <p className="text-[13px] text-ink-400 mt-1">
              {mode === 'setup' ? 'Lege den ersten Admin-Benutzer an.' : 'Lade vorhandene Daten aus deinem Gist.'}
            </p>
          </div>
        </div>

        {mode === 'setup' ? (
          <div className="space-y-3">
            <Field label="Name"><input className="field" value={name} onChange={e => setName(e.target.value)} placeholder="Dein Name"/></Field>
            <Field label="PIN"><input className="field" type="password" value={pin} onChange={e => setPin(e.target.value)} placeholder="Mindestens 4 Zeichen"/></Field>
            <Field label="PIN bestätigen"><input className="field" type="password" value={pin2} onChange={e => setPin2(e.target.value)} placeholder="PIN wiederholen"/></Field>
            {err && <p className="text-[12px] text-[#a13d36]">{err}</p>}
            <button onClick={handleCreate} className="btn btn-primary w-full justify-center">Admin-Konto erstellen</button>
            <button onClick={() => { setMode('cloud'); setErr(''); }} className="w-full text-center text-[12.5px] text-ink-400 hover:text-brand-600 transition-colors pt-1">
              Vorhandene Daten laden (Gist-Token)
            </button>
          </div>
        ) : (
          <div className="space-y-3">
            <button onClick={() => { setMode('setup'); setErr(''); }} className="flex items-center gap-1 text-[12.5px] text-ink-400 hover:text-ink-700 transition-colors">
              <Icon name="chevron-left" cls="w-3.5 h-3.5"/> Zurück
            </button>
            <p className="text-[12.5px] text-ink-500">GitHub Personal Access Token (classic) mit Scope <span className="font-mono text-[11px] bg-ink-50 px-1 py-0.5 rounded border border-line">gist</span> eingeben.</p>
            <Field label="Gist-Token">
              <input className="field" type="password" value={token}
                onChange={e => { setToken(e.target.value); setErr(''); }}
                onKeyDown={e => e.key === 'Enter' && handleCloudLoad()}
                placeholder="ghp_…"/>
            </Field>
            {err && <p className="text-[12px] text-[#a13d36]">{err}</p>}
            <button onClick={handleCloudLoad} disabled={loading} className="btn btn-primary w-full justify-center">
              {loading ? 'Verbinde…' : 'Daten laden'}
            </button>
          </div>
        )}
      </div>
    </div>
  );
};

};

const AssetForm = ({ initial, onSave, onClose, config }) => {
  const isEdit = !!initial?.id;
  const rollen = config?.rlRollen || [];
  const [tab, setTab] = useState('allgemein');
  const [form, setForm] = useState(() => initial || {
    asset_id: '', titel: '', beschreibung: '', status: 'aktiv',
    tech_verantwortung: [], fach_verantwortung: [], ki_rolle: 'nein',
    vertraulichkeit: 'niedrig', integritaet: 'niedrig', verfuegbarkeit: 'niedrig', authentizitaet: 'niedrig',
    datenschutz: 'nicht_klassifiziert',
    bemerkungen: '', anhaenge: [],
  });
  const [pdfLoading, setPdfLoading] = useState(false);

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const toggleList = (key, val) => setForm(f => ({
    ...f, [key]: (f[key] || []).includes(val) ? (f[key] || []).filter(x => x !== val) : [...(f[key] || []), val],
  }));

  const handlePdf = (e) => {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    setPdfLoading(true);
    let done = 0;
    const results = [];
    files.forEach(file => {
      if (file.size > 4 * 1024 * 1024) { alert(`"${file.name}" ist zu groß (max. 4 MB).`); done++; if (done === files.length) setPdfLoading(false); return; }
      const r = new FileReader();
      r.onload = ev => {
        results.push({ name: file.name, size: file.size, data: ev.target.result });
        done++;
        if (done === files.length) { setForm(f => ({ ...f, anhaenge: [...(f.anhaenge || []), ...results] })); setPdfLoading(false); }
      };
      r.readAsDataURL(file);
    });
  };
  const removeAnhang = (idx) => setForm(f => ({ ...f, anhaenge: (f.anhaenge || []).filter((_, i) => i !== idx) }));
  const gesamtschutz = calcGesamtschutz(form);
  const handleSave = () => {
    if (!form.asset_id.trim()) return alert('Bitte eine ID eingeben.');

const BenutzerForm = ({ initial, onSave, onClose, currentUserId }) => {
  const isEdit = !!initial?.id;
  const [name, setName]   = useState(initial?.name || '');
  const [role, setRole]   = useState(initial?.role || 'leser');
  const [pin, setPin]     = useState('');
  const [pin2, setPin2]   = useState('');
  const [err, setErr]     = useState('');

  const handle = async () => {
    if (!name.trim()) return setErr('Bitte einen Namen eingeben.');
    if (!isEdit || pin) {
      if (pin.length < 4) return setErr('PIN muss mindestens 4 Zeichen haben.');
      if (pin !== pin2)   return setErr('PINs stimmen nicht überein.');
    }
    const hashed = pin ? await hashPin(pin) : initial.pin;
    onSave({ ...(initial || {}), id: initial?.id || uuid(), name: name.trim(), role, pin: hashed });
  };

  return (
    <Modal title={isEdit ? 'Benutzer bearbeiten' : 'Neuer Benutzer'} onClose={onClose}
      footer={<><button onClick={onClose} className="btn btn-ghost">Abbrechen</button><button onClick={handle} className="btn btn-primary">Speichern</button></>}>
      <div className="space-y-4">
        <Field label="Name" required><input className="field" value={name} onChange={e => setName(e.target.value)} placeholder="Vollständiger Name"/></Field>
        <Field label="Rolle">
          <div className="flex gap-2">
            {['leser','schreiber','admin'].map(r => (
              <label key={r} onClick={() => setRole(r)}
                className={`flex-1 text-center px-3 py-2 rounded-lg border cursor-pointer text-[12.5px] font-medium transition-colors ${role === r ? 'bg-brand-600 border-brand-600 text-white' : 'bg-white border-line text-ink-500 hover:border-line-strong'}`}>
                {ROLE_LABELS[r]}
              </label>
            ))}
          </div>
          <p className="text-[11.5px] text-ink-400 mt-1.5">
            {role === 'leser' ? 'Kann nur lesen, nichts bearbeiten.' : role === 'schreiber' ? 'Kann anlegen und bearbeiten, aber nicht löschen.' : 'Voller Zugriff inkl. Löschen und Einstellungen.'}
          </p>
        </Field>
        <Field label={isEdit ? 'Neue PIN (leer lassen = unverändert)' : 'PIN'} required={!isEdit}>
          <input className="field" type="password" value={pin} onChange={e => setPin(e.target.value)} placeholder={isEdit ? 'Nur ausfüllen zum Ändern' : 'Mindestens 4 Zeichen'}/>
        </Field>
        {(!isEdit || pin) && (
          <Field label="PIN bestätigen" required>
            <input className="field" type="password" value={pin2} onChange={e => setPin2(e.target.value)} placeholder="PIN wiederholen"/>
          </Field>
        )}
        {err && <p className="text-[12px] text-[#a13d36]">{err}</p>}
      </div>
    </Modal>
  );
};
