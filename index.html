        <h1 className="text-[28px] font-medium text-ink-900 tracking-tight leading-none">Benutzerverwaltung</h1>
        <p className="text-[13px] text-ink-400 mt-2">Benutzer und Zugriffsrechte verwalten.</p>
      </div>
      <button onClick={onCreate} className="btn btn-primary"><Icon name="plus" cls="w-3.5 h-3.5"/> Neuer Benutzer</button>
    </div>
    <div className="card shadow-soft overflow-hidden">
      <table className="data-table">
        <thead><tr><th>Name</th><th>Rolle</th><th></th></tr></thead>
        <tbody>
          {users.map(u => (
            <tr key={u.id}>
              <td>
                <div className="flex items-center gap-2.5">
                  <div className="w-7 h-7 rounded-full bg-brand-100 flex items-center justify-center text-brand-700 text-[12px] font-semibold flex-shrink-0">
                    {u.name.charAt(0).toUpperCase()}
                  </div>
                  <p className="text-[13.5px] font-medium text-ink-900">{u.name}{u.id === session.id && <span className="ml-2 text-[11px] text-ink-400">(ich)</span>}</p>
                </div>
              </td>
              <td><span className={`text-[11.5px] font-medium px-2 py-0.5 rounded border ${ROLE_COLORS[u.role]}`}>{ROLE_LABELS[u.role]}</span></td>
              <td onClick={e => e.stopPropagation()}>
                <div className="flex items-center gap-0.5 justify-end">
                  <button onClick={() => onEdit(u)} className="p-1.5 rounded-md text-ink-400 hover:text-ink-900 hover:bg-ink-50 transition-colors" title="Bearbeiten"><Icon name="edit" cls="w-3.5 h-3.5"/></button>
                  {u.id !== session.id && <button onClick={() => onDelete(u.id)} className="p-1.5 rounded-md text-ink-400 hover:text-[#a13d36] hover:bg-rose-50 transition-colors" title="Löschen"><Icon name="trash" cls="w-3.5 h-3.5"/></button>}
                </div>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  </div>
);

// ── App ────────────────────────────────────────────────────────────────────
const App = () => {
  const [data, setData] = useState(() => loadData() || SEED);
  const [session, setSession] = useState(() => {
    try { return JSON.parse(sessionStorage.getItem(SESSION_KEY)); } catch { return null; }
  });
  const [view, setView] = useState('start');
  const [showSettings, setShowSettings] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(() => window.innerWidth >= 1024);
  const [anforderungModal, setAnforderungModal] = useState(null);
  const [anforderungDetail, setAnforderungDetail] = useState(null);
  const [richtlinieModal, setRichtlinieModal] = useState(null);
  const [richtlinieDetail, setRichtlinieDetail] = useState(null);
  const [assetModal, setAssetModal] = useState(null);
  const [assetDetail, setAssetDetail] = useState(null);
  const [syncStatus, setSyncStatus] = useState('idle');
  const gistLoadedRef = useRef(false);
  const saveTimerRef  = useRef(null);

  // Load from Gist on mount if token is configured
  useEffect(() => {
    const token = localStorage.getItem(GIST_TOKEN_KEY);
    if (!token) return;
    setSyncStatus('syncing');
    (async () => {
      try {
        const gistId = await findOrCreateGist(token, data);
        const gistData = await loadFromGist(token, gistId);
        gistLoadedRef.current = true;
        setData(gistData);
        saveData(gistData);
        setSyncStatus('synced');
      } catch { setSyncStatus('error'); }
    })();
  }, []);

  // Save locally + debounced Gist sync on every data change
  useEffect(() => {
    if (gistLoadedRef.current) { gistLoadedRef.current = false; return; }
    saveData(data);
    const token = localStorage.getItem(GIST_TOKEN_KEY);
    if (!token) return;
    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
    setSyncStatus('syncing');
    saveTimerRef.current = setTimeout(async () => {
      try {
        const gistId = localStorage.getItem(GIST_ID_KEY);
        await saveToGist(token, gistId, data);
        setSyncStatus('synced');
      } catch { setSyncStatus('error'); }
    }, 1500);
  }, [data]);

  const handleLogin = (sess) => {
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(sess));
    setSession(sess);
    setView('start');
  };
  const handleLogout = () => {
    sessionStorage.removeItem(SESSION_KEY);
    setSession(null);
  };
  const handleFirstSetup = (user) => {
    const newData = { ...data, users: [user] };
    saveData(newData);
    setData(newData);
    handleLogin({ id: user.id, name: user.name, role: user.role });
  };

  const handleCloudLoad = (token, loadedData) => {
    localStorage.setItem(GIST_TOKEN_KEY, token);
    saveData(loadedData);
    setData(loadedData);
    // session bleibt null → LoginScreen zeigt jetzt die geladenen Benutzer
  };

  const handleConnectGist = async (token) => {
    localStorage.setItem(GIST_TOKEN_KEY, token);
    localStorage.removeItem(GIST_ID_KEY);
    setSyncStatus('syncing');
    const gistId = await findOrCreateGist(token, data);
    await saveToGist(token, gistId, data);
    setSyncStatus('synced');
  };
  const handleDisconnectGist = () => {
    if (!confirm('Cloud-Sync trennen? Daten bleiben lokal erhalten.')) return;
    localStorage.removeItem(GIST_TOKEN_KEY);
    localStorage.removeItem(GIST_ID_KEY);
    setSyncStatus('idle');
  };

  // ── Benutzer CRUD ──
  const createBenutzer = (form) => {
    setData(d => ({ ...d, users: [...(d.users || []), form] }));
  };
  const updateBenutzer = (form) => {
    setData(d => ({ ...d, users: (d.users || []).map(u => u.id === form.id ? form : u) }));
    if (session?.id === form.id) {
      const updated = { id: form.id, name: form.name, role: form.role };
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(updated));
      setSession(updated);
    }
  };
  const deleteBenutzer = (id) => {
    if (!confirm('Benutzer wirklich löschen?')) return;
    setData(d => ({ ...d, users: (d.users || []).filter(u => u.id !== id) }));
  };

  // ── Anforderungen CRUD ──
  const createAnforderung = (form) => {
    const now = nowISO();
    setData(d => ({ ...d, anforderungen: [...(d.anforderungen || []), { ...form, id: uuid(), erstellt_am: now, aktualisiert_am: now }] }));
    setAnforderungModal(null);
  };
  const updateAnforderung = (form) => {
    setData(d => ({ ...d, anforderungen: (d.anforderungen || []).map(a => a.id === form.id ? { ...a, ...form, aktualisiert_am: nowISO() } : a) }));
    setAnforderungModal(null);
  };
  const deleteAnforderung = (id) => {
    if (!confirm('Anforderung wirklich löschen?')) return;
    setData(d => ({
      ...d,
      anforderungen: (d.anforderungen || []).filter(a => a.id !== id),
      richtlinien: (d.richtlinien || []).map(r => ({ ...r, anforderungen_ids: (r.anforderungen_ids || []).filter(x => x !== id) })),
    }));
  };

  // ── Richtlinien CRUD ──
  const createRichtlinie = (form) => {
    const now = nowISO();
    setData(d => ({ ...d, richtlinien: [...(d.richtlinien || []), { ...form, id: uuid(), erstellt_am: now, aktualisiert_am: now }] }));
    setRichtlinieModal(null);
  };
  const updateRichtlinie = (form) => {
    setData(d => ({ ...d, richtlinien: (d.richtlinien || []).map(r => r.id === form.id ? { ...r, ...form, aktualisiert_am: nowISO() } : r) }));
    setRichtlinieModal(null);
    setRichtlinieDetail(prev => prev?.id === form.id ? { ...prev, ...form, aktualisiert_am: nowISO() } : prev);
  };
  const deleteRichtlinie = (id) => {
    if (!confirm('Richtlinie wirklich löschen?')) return;
    setData(d => ({ ...d, richtlinien: (d.richtlinien || []).filter(r => r.id !== id) }));
  };

  const handleConfigChange  = (newConfig) => setData(d => ({ ...d, config: newConfig }));
  const handleWelcomeChange = (text) => setData(d => ({ ...d, config: { ...(d.config || DEFAULT_CONFIG), welcomeText: text } }));

  // ── Assets CRUD ──
  const createAsset = (form) => {
    const now = nowISO();
    setData(d => ({ ...d, assets: [...(d.assets || []), { ...form, id: uuid(), erstellt_am: now, aktualisiert_am: now }] }));
    setAssetModal(null);
  };
  const updateAsset = (form) => {
    setData(d => ({ ...d, assets: (d.assets || []).map(a => a.id === form.id ? { ...a, ...form, aktualisiert_am: nowISO() } : a) }));
    setAssetModal(null);
    setAssetDetail(prev => prev?.id === form.id ? { ...prev, ...form, aktualisiert_am: nowISO() } : prev);
  };
  const deleteAsset = (id) => {
    if (!confirm('Asset wirklich löschen?')) return;
    setData(d => ({ ...d, assets: (d.assets || []).filter(a => a.id !== id) }));
  };

  const anf     = data.anforderungen || [];
  const rl      = data.richtlinien  || [];
  const assets  = data.assets || [];
  const users   = data.users || [];
  const cfg     = getConfig(data);
  const isAdmin   = session?.role === 'admin';
  const canEdit   = session?.role === 'schreiber' || isAdmin;
  const canDelete = isAdmin;

  const navItems = [
    { id: 'start',         label: 'Start',               icon: 'home'   },
    { id: 'anforderungen', label: 'Anforderungen',        icon: 'list',  count: anf.length    },
    { id: 'richtlinien',   label: 'Richtlinien',          icon: 'book',  count: rl.length     },
    { id: 'assets',        label: 'Assets',               icon: 'layers',count: assets.length },
  ];

  if (!session) return (
    <LoginScreen
      users={users}
      onLogin={handleLogin}
      onFirstSetup={handleFirstSetup}
      onCloudLoad={handleCloudLoad}
    />
  );

  return (
    <div className="flex h-screen overflow-hidden">
      {/* Mobile backdrop */}
      {sidebarOpen && <div className="fixed inset-0 z-30 bg-black/40 lg:hidden" onClick={() => setSidebarOpen(false)}/>}

      {/* Sidebar */}
      <aside className={`sidebar-transition fixed lg:static top-0 left-0 h-full z-40 lg:z-auto flex-shrink-0
        ${sidebarOpen ? 'w-[220px] translate-x-0' : '-translate-x-full lg:translate-x-0 lg:w-[56px]'}
        bg-[#eef3f7] border-r border-line flex flex-col`}>
        <div className="flex items-center gap-2.5 px-3.5 h-[60px] border-b border-line">
          <div className="w-7 h-7 rounded-[7px] bg-brand-600 flex items-center justify-center flex-shrink-0 text-white">
            <Icon name="shield" cls="w-3.5 h-3.5"/>
          </div>
          {sidebarOpen && (
            <div className="flex-1 min-w-0">
              <p className="text-[13px] font-semibold text-ink-900 leading-tight tracking-tight">Compliance-</p>
              <p className="text-[11px] text-ink-400 leading-tight">Management</p>
            </div>
          )}
          {sidebarOpen && (
            <button onClick={() => setSidebarOpen(false)} className="p-1.5 rounded-md text-ink-400 hover:text-ink-900 hover:bg-ink-100 transition-colors">
              <Icon name="sidebar" cls="w-3.5 h-3.5"/>
            </button>
          )}
        </div>
        {!sidebarOpen && (
          <button onClick={() => setSidebarOpen(true)} className="m-2 p-2 rounded-md text-ink-400 hover:text-ink-900 hover:bg-ink-100 transition-colors flex justify-center">
            <Icon name="sidebar" cls="w-3.5 h-3.5"/>
          </button>
        )}

        <nav className="flex-1 px-2 py-3 space-y-0.5">
          {sidebarOpen && <p className="px-2 mb-1.5 text-[10px] font-medium text-ink-300 uppercase tracking-wider">Navigation</p>}
          {navItems.map(item => (
            <button key={item.id} onClick={() => { setView(item.id); if (window.innerWidth < 1024) setSidebarOpen(false); }}
              className={`nav-item w-full ${view === item.id ? 'active' : ''}`}>
              <Icon name={item.icon} cls="w-3.5 h-3.5 flex-shrink-0"/>
              {sidebarOpen && (
                <>
                  <span className="flex-1 text-left">{item.label}</span>
                  {item.count != null && <span className="font-mono text-[10.5px] opacity-60">{item.count}</span>}
                </>
              )}
            </button>
          ))}
        </nav>

        <div className="px-2 py-3 border-t border-line space-y-0.5">
          {sidebarOpen && (
            <div className="flex items-center gap-1.5 px-2 py-1 mb-1">
              <span className="w-1.5 h-1.5 rounded-full bg-amber-400 flex-shrink-0"/>
              <span className="text-[11px] font-medium text-amber-700 tracking-wide">Testumgebung</span>
            </div>
          )}
          {sidebarOpen && syncStatus !== 'idle' && (
            <div className="flex items-center gap-2 px-2 py-1.5 rounded-lg">
              <span className={`w-1.5 h-1.5 rounded-full flex-shrink-0 ${
                syncStatus === 'synced'  ? 'bg-[#4a8a7a]' :
                syncStatus === 'syncing' ? 'bg-petrol-400 animate-pulse' : 'bg-[#b53a31]'
              }`}/>
              <span className={`text-[11px] font-medium ${
                syncStatus === 'synced'  ? 'text-[#2e5a4d]' :
                syncStatus === 'syncing' ? 'text-petrol-600' : 'text-[#a13d36]'
              }`}>{syncStatus === 'synced' ? 'Synchronisiert' : syncStatus === 'syncing' ? 'Synchronisiere…' : 'Sync-Fehler'}</span>
            </div>
          )}
          {isAdmin && (
            <button onClick={() => { setShowSettings(true); if (window.innerWidth < 1024) setSidebarOpen(false); }} className="nav-item w-full">
              <Icon name="settings" cls="w-3.5 h-3.5 flex-shrink-0"/>
              {sidebarOpen && 'Einstellungen'}
            </button>
          )}
          {sidebarOpen && (
            <div className="flex items-center gap-2 px-2 py-2 mt-1">
              <div className="w-6 h-6 rounded-full bg-brand-100 flex items-center justify-center text-brand-700 text-[11px] font-semibold flex-shrink-0">
                {session.name.charAt(0).toUpperCase()}
              </div>
              <span className="flex-1 text-[12px] text-ink-600 truncate">{session.name}</span>
              <button onClick={handleLogout} className="p-1 rounded text-ink-300 hover:text-ink-700 transition-colors" title="Abmelden">
                <Icon name="log-out" cls="w-3.5 h-3.5"/>
              </button>
            </div>
          )}
          {!sidebarOpen && (
            <button onClick={handleLogout} className="nav-item w-full justify-center" title="Abmelden">
              <Icon name="log-out" cls="w-3.5 h-3.5"/>
            </button>
          )}
        </div>
      </aside>

      {/* Main */}
      <main className="flex-1 overflow-y-auto min-w-0">
        {/* Mobile top bar */}
        <div className="lg:hidden sticky top-0 z-20 h-14 bg-[#eef3f7] border-b border-line flex items-center px-4 gap-3">
          <button onClick={() => setSidebarOpen(true)} className="p-2 rounded-md text-ink-500 hover:text-ink-900 hover:bg-ink-100 transition-colors flex-shrink-0">
            <Icon name="sidebar" cls="w-4 h-4"/>
          </button>
          <div className="flex items-center gap-2 min-w-0">
            <div className="w-6 h-6 rounded-[6px] bg-brand-600 flex items-center justify-center text-white flex-shrink-0">
              <Icon name="shield" cls="w-3 h-3"/>
            </div>
            <span className="text-[13.5px] font-semibold text-ink-900 tracking-tight truncate">Compliance-Management</span>
            <span className="flex-shrink-0 inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-medium bg-amber-100 text-amber-700 border border-amber-200 leading-none"><span className="w-1.5 h-1.5 rounded-full bg-amber-400"/>Testumgebung</span>
          </div>
          {syncStatus !== 'idle' && (
            <span className={`ml-auto flex-shrink-0 w-2 h-2 rounded-full ${
              syncStatus === 'synced'  ? 'bg-[#4a8a7a]' :
              syncStatus === 'syncing' ? 'bg-petrol-400 animate-pulse' : 'bg-[#b53a31]'
            }`}/>
          )}
        </div>

        <div className="max-w-[1400px] mx-auto px-4 py-6 sm:px-6 md:px-8 lg:px-10 lg:py-10">
          {view === 'start' && (
            <StartseiteView session={session} data={data} onEditWelcome={handleWelcomeChange} isAdmin={isAdmin}/>
          )}
          {view === 'anforderungen' && (
            <AnforderungenView
              anforderungen={anf} config={cfg} canEdit={canEdit} canDelete={canDelete}
              onCreate={() => setAnforderungModal('new')}
              onView={a => setAnforderungDetail(a)}
              onEdit={a => setAnforderungModal(a)}
              onDelete={deleteAnforderung}
            />
          )}
          {view === 'richtlinien' && (
            <RichtlinienView
              richtlinien={rl} config={cfg} canEdit={canEdit} canDelete={canDelete}
              onCreate={() => setRichtlinieModal('new')}
              onView={r => setRichtlinieDetail(r)}
              onEdit={r => setRichtlinieModal(r)}
              onDelete={deleteRichtlinie}
            />
          )}
          {view === 'assets' && (
            <AssetsView
              assets={assets} config={cfg} canEdit={canEdit} canDelete={canDelete}
              onCreate={() => setAssetModal('new')}
              onView={a => setAssetDetail(a)}
              onEdit={a => setAssetModal(a)}
              onDelete={deleteAsset}
            />
          )}
        </div>
      </main>

      {/* Anforderung Form */}
      {anforderungModal && (
        <AnforderungForm
          initial={anforderungModal === 'new' ? { anforderung_id: '', kategorie: Object.keys(cfg.anfKategorien)[0] || '', unterkategorie: '', beschreibung: '' } : anforderungModal}
          onSave={anforderungModal === 'new' ? createAnforderung : updateAnforderung}
          onClose={() => setAnforderungModal(null)}
          anforderungen={anf} config={cfg}
        />
      )}

      {/* Anforderung Detail */}
      {anforderungDetail && (
        <AnforderungDetailPanel
          anforderung={anforderungDetail} richtlinien={rl} canEdit={canEdit}
          onEdit={() => { setAnforderungModal(anforderungDetail); setAnforderungDetail(null); }}
          onClose={() => setAnforderungDetail(null)}
        />
      )}

      {/* Richtlinie Form */}
      {richtlinieModal && (
        <RichtlinieForm
          initial={richtlinieModal === 'new' ? { richtlinie_id: '', titel: '', kategorie: Object.keys(cfg.rlKategorien)[0] || '', art: cfg.rlArt[1] || cfg.rlArt[0] || '', vertraulichkeit: 'K2', anwender: [], rollen: [], pdf: null, anforderungen_ids: [] } : richtlinieModal}
          onSave={richtlinieModal === 'new' ? createRichtlinie : updateRichtlinie}
          onClose={() => setRichtlinieModal(null)}
          anforderungen={anf} config={cfg}
        />
      )}

      {/* Richtlinie Detail */}
      {richtlinieDetail && (
        <RichtlinieDetailPanel
          richtlinie={richtlinieDetail} anforderungen={anf} canEdit={canEdit}
          onEdit={() => { setRichtlinieModal(richtlinieDetail); setRichtlinieDetail(null); }}
          onClose={() => setRichtlinieDetail(null)}
        />
      )}

      {/* Asset Form */}
      {assetModal && (
        <AssetForm
          initial={assetModal === 'new' ? null : assetModal}
          onSave={assetModal === 'new' ? createAsset : updateAsset}
          onClose={() => setAssetModal(null)}
          config={cfg}
        />
      )}

      {/* Asset Detail */}
      {assetDetail && (
        <AssetDetailPanel
          asset={assetDetail} canEdit={canEdit}
          onEdit={() => { setAssetModal(assetDetail); setAssetDetail(null); }}
          onClose={() => setAssetDetail(null)}
        />
      )}

      {showSettings && (
        <EinstellungenModal
          data={data}
          onImport={newData => { setData({ anforderungen: newData.anforderungen || [], richtlinien: newData.richtlinien || [], assets: newData.assets || [], users: newData.users || [], config: newData.config || DEFAULT_CONFIG }); saveData(newData); setShowSettings(false); }}
          onClose={() => setShowSettings(false)}
          syncStatus={syncStatus}
          onConnectGist={handleConnectGist}
          onDisconnectGist={handleDisconnectGist}
          onConfigChange={handleConfigChange}
          users={users}
          session={session}
          onCreateBenutzer={createBenutzer}
          onUpdateBenutzer={updateBenutzer}
          onDeleteBenutzer={deleteBenutzer}
        />
      )}
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
