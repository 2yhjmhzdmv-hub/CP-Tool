name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  repository_dispatch:
    types: [test-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout test/dev
        uses: actions/checkout@v4
        with:
          ref: test/dev
          path: test-branch

      - name: Build site structure
        run: |
          mkdir -p site/test
          cp test-branch/index.html site/test/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
